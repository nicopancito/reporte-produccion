<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="180" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Gato de nico mientras carga: camina un rato, se lame la patita y vuelve a caminar. Borde blanco para modo oscuro. -->
  <style>
    .leg-fl{transform-origin:68px 108px;animation:lame 4.8s linear infinite}
    .leg-fr{transform-origin:85px 112px;animation:pasoB 4.8s linear infinite}
    .leg-bl{transform-origin:112px 108px;animation:pasoB 4.8s linear infinite}
    .leg-br{transform-origin:132px 110px;animation:pasoA 4.8s linear infinite}
    .cuerpo{animation:bote 4.8s linear infinite}
    .head{transform-origin:65px 65px;animation:cabeza 4.8s ease-in-out infinite}
    .tail{transform-origin:138px 72px;animation:cola 2.5s ease-in-out infinite}
    .eyes{transform-origin:58px 60px;animation:parpadeo 4s infinite}
    .tongue{opacity:0;animation:lengua 4.8s ease-in-out infinite}
    @keyframes pasoA{0%{transform:rotate(-16deg)}6.25%{transform:rotate(16deg)}12.5%{transform:rotate(-16deg)}18.75%{transform:rotate(16deg)}25%{transform:rotate(-16deg)}31.25%{transform:rotate(16deg)}37.5%{transform:rotate(-16deg)}43.75%{transform:rotate(16deg)}50%{transform:rotate(0deg)}100%{transform:rotate(-16deg)}}
    @keyframes pasoB{0%{transform:rotate(16deg)}6.25%{transform:rotate(-16deg)}12.5%{transform:rotate(16deg)}18.75%{transform:rotate(-16deg)}25%{transform:rotate(16deg)}31.25%{transform:rotate(-16deg)}37.5%{transform:rotate(16deg)}43.75%{transform:rotate(-16deg)}50%{transform:rotate(0deg)}96%{transform:rotate(0deg)}100%{transform:rotate(16deg)}}
    @keyframes lame{0%{transform:rotate(-16deg)}6.25%{transform:rotate(16deg)}12.5%{transform:rotate(-16deg)}18.75%{transform:rotate(16deg)}25%{transform:rotate(-16deg)}31.25%{transform:rotate(16deg)}37.5%{transform:rotate(-16deg)}43.75%{transform:rotate(16deg)}50%{transform:rotate(0deg)}55%{transform:rotate(138deg)}65%{transform:rotate(152deg)}75%{transform:rotate(138deg)}85%{transform:rotate(152deg)}93%{transform:rotate(138deg)}100%{transform:rotate(-16deg)}}
    @keyframes bote{0%{transform:translateY(0px)}6.25%{transform:translateY(-3px)}12.5%{transform:translateY(0px)}18.75%{transform:translateY(-3px)}25%{transform:translateY(0px)}31.25%{transform:translateY(-3px)}37.5%{transform:translateY(0px)}43.75%{transform:translateY(-3px)}50%{transform:translateY(0px)}100%{transform:translateY(0)}}
    @keyframes cabeza{0%{transform:rotate(0)}50%{transform:rotate(0)}55%{transform:rotate(10deg) translateY(3px)}65%{transform:rotate(18deg) translateY(7px)}75%{transform:rotate(10deg) translateY(3px)}85%{transform:rotate(18deg) translateY(7px)}93%{transform:rotate(10deg) translateY(3px)}100%{transform:rotate(0)}}
    @keyframes lengua{0%,55%,70%,75%,90%,100%{opacity:0;transform:translateY(0)}60%,66%,80%,86%{opacity:1;transform:translateY(-3px)}}
    @keyframes cola{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
    @keyframes parpadeo{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.05)}}
  </style>
  <defs>
    <filter id="borde" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="grueso"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="grueso" operator="in" result="contorno"/>
      <feMerge><feMergeNode in="contorno"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#borde)" fill="#141414">
    <g class="cuerpo">
      <rect class="leg-bl" x="104" y="98" width="16" height="36" rx="8"/>
      <path class="tail" d="M135 78 C135 45,138 30,148 30 C156 30,154 42,148 45 C145 48,146 68,142 82 Z"/>
      <path d="M52 75 C52 55,85 52,115 52 C142 52,150 75,145 98 C140 115,115 114,85 114 C60 114,52 95,52 75 Z"/>
      <rect class="leg-br" x="122" y="98" width="17" height="40" rx="8.5"/>
      <rect class="leg-fr" x="76" y="100" width="18" height="44" rx="9"/>
      <g class="head">
        <path d="M42 48 L40 26 C40 22,45 22,50 26 L62 38 Z"/>
        <path d="M68 38 L80 26 C85 22,90 22,89 27 L88 48 Z"/>
        <ellipse cx="64" cy="58" rx="28" ry="24"/>
        <ellipse class="tongue" cx="52" cy="78" rx="4" ry="6" fill="#ff7eb3"/>
        <g class="eyes" fill="#fff">
          <path d="M42 54 Q47 50 51 56 Q46 61 42 54 Z"/>
          <path d="M64 56 Q70 51 76 55 Q71 62 64 56 Z"/>
        </g>
      </g>
      <rect class="leg-fl" x="60" y="98" width="16" height="38" rx="8"/>
    </g>
  </g>
</svg>
